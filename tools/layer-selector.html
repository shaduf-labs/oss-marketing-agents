<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';"><title>Safe layer selector</title><style>body{margin:0;background:#f7fcf9;color:#17372a;font:16px/1.45 system-ui,sans-serif}*{box-sizing:border-box}#selector{padding:1.15rem;max-width:760px;margin:auto}.eyebrow{margin:0 0 .4rem;color:#18735b;font-size:.75rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase}h2{margin:.15rem 0 .75rem;font-size:1.3rem}fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}.choice{display:block;padding:.75rem;border:1px solid #bcdccc;border-radius:.7rem;background:#fff;color:inherit;font:inherit;line-height:inherit;text-align:left;cursor:pointer}.choice[aria-pressed="true"]{border-color:#176b53;background:#eaf7ef;box-shadow:inset 0 0 0 1px #176b53}button.choice{margin:0}.choice:focus-visible{outline:3px solid #e69520;outline-offset:2px}#answer{margin-top:1rem;padding:1rem;border-left:4px solid #188466;border-radius:0 .6rem .6rem 0;background:#eaf7ef}#answer strong{display:block;margin-bottom:.25rem}button{margin-top:.7rem;border:0;border-radius:.5rem;padding:.55rem .75rem;background:#176b53;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #e69520;outline-offset:3px}@media(max-width:480px){fieldset{grid-template-columns:1fr}}</style></head><body><main id="selector" data-shaduf-resize-root><p class="eyebrow">Layer selector</p><h2>What are you trying to own today?</h2><fieldset><legend>Choose a marketing job</legend><button class="choice" type="button" data-job="system" aria-pressed="true">Contacts, forms and campaigns</button><button class="choice" type="button" data-job="flow" aria-pressed="false">Connect existing tools</button><button class="choice" type="button" data-job="skills" aria-pressed="false">Plan in an agent harness</button><button class="choice" type="button" data-job="pilot" aria-pressed="false">Try a small local draft</button></fieldset><section id="answer" aria-live="polite"></section><button type="button" id="reset">Start over</button></main><script>const data={system:['Start with Mautic','Use it when you can own the database, mail transport and scheduled operations. Begin with a test form and test mail transport—not real contacts.'],flow:['Start with Activepieces CE','Use it to connect systems you already operate. First prove a manual, draft-only flow and its failure visibility.'],skills:['Start with Marketing Agent OS','Use a small set of skills in an approved harness. Keep connectors and secrets out of the first planning exercise.'],pilot:['Start with Loopmark Agent','Treat this only as an exploratory local drafting CLI. Keep social credentials unset and use a disposable data directory.']};const answer=document.querySelector('#answer'),choices=[...document.querySelectorAll('[data-job]')];function selected(){return choices.find(choice=>choice.getAttribute('aria-pressed')==='true')}function choose(choice){choices.forEach(item=>item.setAttribute('aria-pressed',String(item===choice)));render()}function render(){const [title,copy]=data[selected().dataset.job];answer.innerHTML='<strong>'+title+'</strong><span>'+copy+'</span>'}choices.forEach(choice=>choice.addEventListener('click',()=>choose(choice)));document.querySelector('#reset').addEventListener('click',()=>{choose(choices[0]);choices[0].focus()});render();</script><script src="../assets/shaduf-tool-resize.js"></script></body></html>
