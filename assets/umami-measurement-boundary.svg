<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><title id="t">Newsletter measurement boundaries</title><desc id="d">The email sender, tagged site, Umami analytics and account database hold different evidence.</desc><style>text{font-family:system-ui,sans-serif;fill:#17372a}.box{fill:#f5faf7;stroke:#9ecab5;stroke-width:2}.core{fill:#e7f4ec;stroke:#25815f;stroke-width:2}.h{font-size:18px;font-weight:750}.s{font-size:13px}.a{stroke:#25815f;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#aa7520;stroke-width:2;stroke-dasharray:5 5}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#25815f"/></marker></defs><rect class="box" x="14" y="37" width="202" height="126" rx="14"/><text class="h" x="30" y="69">Email sender</text><text class="s" x="30" y="94">Delivery / provider clicks</text><text class="s" x="30" y="117">outside Umami</text><path class="a" d="M219 100H258"/><rect class="box" x="263" y="37" width="202" height="126" rx="14"/><text class="h" x="279" y="69">Site arrival</text><text class="s" x="279" y="94">Generic UTM URL</text><text class="s" x="279" y="117">may load tracker</text><path class="a" d="M468 100H507"/><rect class="core" x="512" y="37" width="202" height="126" rx="14"/><text class="h" x="528" y="69">Umami</text><text class="s" x="528" y="94">Page view + custom event</text><text class="s" x="528" y="117">goal / attribution rules</text><path class="a" d="M717 100H756"/><rect class="box" x="761" y="37" width="184" height="126" rx="14"/><text class="h" x="777" y="69">Account DB</text><text class="s" x="777" y="94">Verified signup</text><text class="s" x="777" y="117">outside Umami</text><path class="dash" d="M612 168V197H850V168"/><text class="s" x="609" y="221">Reconcile; do not equate an event with an account.</text></svg>
