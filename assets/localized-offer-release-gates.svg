<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="title desc"><title id="title">Localized offer release gates</title><desc id="desc">A revised source card flows through two locale reviews, then into independent landing, email and social release controls.</desc><rect width="920" height="310" rx="24" fill="#f5faf7"/><g font-family="system-ui, sans-serif" fill="#17372a"><rect x="28" y="48" width="172" height="210" rx="18" fill="#176b53"/><text x="48" y="89" fill="white" font-size="20" font-weight="700">Source card v2</text><text x="48" y="121" fill="white" font-size="14">Amount · eligibility</text><text x="48" y="145" fill="white" font-size="14">End date · CTA · URL</text><text x="48" y="205" fill="#d7f3e6" font-size="14">All v1 rows stale</text><path d="M204 154h48" stroke="#6aaf8c" stroke-width="4" marker-end="url(#arrow)"/><rect x="260" y="28" width="240" height="110" rx="16" fill="#e5f5ed" stroke="#87baa0"/><text x="278" y="63" font-size="19" font-weight="700">English variants</text><text x="278" y="93" font-size="14">Copy + fact review</text><rect x="260" y="172" width="240" height="110" rx="16" fill="#fff5df" stroke="#e0ad4d"/><text x="278" y="207" font-size="19" font-weight="700">Spanish variants</text><text x="278" y="237" font-size="14">Language + fact review</text><path d="M204 154h30v73h18" fill="none" stroke="#6aaf8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 82h42m-42 144h42" stroke="#6aaf8c" stroke-width="4" marker-end="url(#arrow)"/><rect x="552" y="35" width="336" height="72" rx="13" fill="white" stroke="#bad7c8"/><text x="570" y="65" font-size="17" font-weight="700">Landing</text><text x="675" y="65" font-size="14">Deploy + visible-page receipt</text><rect x="552" y="120" width="336" height="72" rx="13" fill="white" stroke="#bad7c8"/><text x="570" y="150" font-size="17" font-weight="700">Email</text><text x="675" y="150" font-size="14">Queue/send receipt</text><rect x="552" y="205" width="336" height="72" rx="13" fill="white" stroke="#bad7c8"/><text x="570" y="235" font-size="17" font-weight="700">Social</text><text x="675" y="235" font-size="14">Schedule/live receipt</text></g><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0l7 3.5L0 7" fill="#6aaf8c"/></marker></defs></svg>
