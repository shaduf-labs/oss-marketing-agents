<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">Two different search measurements</title><desc id="desc">Search Console aggregates observed impressions and clicks over complete dates. SerpBear records one provider or proxy result snapshot at a stated time and depth. Compare scope before interpreting a difference.</desc>
<rect width="900" height="310" rx="24" fill="#f4faf6"/>
<rect x="22" y="24" width="398" height="210" rx="18" fill="#e0f3e9" stroke="#8cc4a8" stroke-width="2"/>
<rect x="480" y="24" width="398" height="210" rx="18" fill="#fff4d9" stroke="#e0bf72" stroke-width="2"/>
<text x="48" y="66" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#174e3c">Search Console</text>
<text x="48" y="104" font-family="system-ui,sans-serif" font-size="17" fill="#234e3e">Observed impressions and clicks</text>
<text x="48" y="134" font-family="system-ui,sans-serif" font-size="17" fill="#234e3e">Average position across impressions</text>
<text x="48" y="176" font-family="system-ui,sans-serif" font-size="15" fill="#426355">Query · page/property · country · device</text>
<text x="48" y="202" font-family="system-ui,sans-serif" font-size="15" fill="#426355">Web search · complete date range</text>
<text x="506" y="66" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#694b19">SerpBear snapshot</text>
<text x="506" y="104" font-family="system-ui,sans-serif" font-size="17" fill="#5b4825">Provider or proxy result</text>
<text x="506" y="134" font-family="system-ui,sans-serif" font-size="17" fill="#5b4825">Matched URL at one request time</text>
<text x="506" y="176" font-family="system-ui,sans-serif" font-size="15" fill="#695a40">Exact query · location · device · depth</text>
<text x="506" y="202" font-family="system-ui,sans-serif" font-size="15" fill="#695a40">Provider response and error status</text>
<path d="M420 128h60" stroke="#779689" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="450" cy="128" r="21" fill="#fff" stroke="#779689" stroke-width="2"/>
<text x="450" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#4d685d">≠</text>
<rect x="139" y="252" width="622" height="40" rx="20" fill="#185b46"/>
<text x="450" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">Match scope, inspect errors, then decide what remains unknown</text>
</svg>
