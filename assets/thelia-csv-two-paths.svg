<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title desc"><title id="title">Thelia newsletter CSV has two writers</title><desc id="desc">The generic core export uses MailingExport, ExportHandler and CSVSerializer; the Twig back-office newsletter download uses its own controller and writer. Each route gains a guard in a different package release.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#17372a}.head{font-weight:800;font-size:18px}.sub{font-size:14px}.tag{font-size:13px;font-weight:700;fill:#075f4b}.line{stroke:#28735a;stroke-width:3;fill:none;stroke-linecap:round}.box{fill:#fff;stroke:#9fcdb8;stroke-width:2}.fix{fill:#e5f4eb;stroke:#176b53;stroke-width:2}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#28735a"/></marker></defs><rect width="920" height="340" rx="18" fill="#f7fcf9"/><text class="head" x="28" y="40">Two independent newsletter CSV routes</text><text class="tag" x="28" y="80">CORE PACKAGE · 3.2.0 → 3.2.1</text><rect class="box" x="28" y="96" width="222" height="82" rx="12"/><text class="head" x="46" y="127">MailingExport</text><text class="sub" x="46" y="151">newsletter fields · JSON cache</text><path class="line" d="M250 137h34" marker-end="url(#a)"/><rect class="box" x="290" y="96" width="205" height="82" rx="12"/><text class="head" x="308" y="127">ExportHandler</text><text class="sub" x="308" y="151">aliases → serializer</text><path class="line" d="M495 137h34" marker-end="url(#a)"/><rect class="fix" x="535" y="96" width="357" height="82" rx="12"/><text class="head" x="553" y="127">CSVSerializer</text><text class="sub" x="553" y="151">3.2.1 guards each value before row write</text><text class="tag" x="28" y="217">TWIG BACK-OFFICE PACKAGE · 1.2.1 → 1.2.2</text><rect class="box" x="28" y="234" width="350" height="78" rx="12"/><text class="head" x="46" y="264">NewsletterController</text><text class="sub" x="46" y="288">direct subscriber export · five fields</text><path class="line" d="M378 273h80" marker-end="url(#a)"/><rect class="fix" x="464" y="234" width="428" height="78" rx="12"/><text class="head" x="482" y="264">Local csvLine writer</text><text class="sub" x="482" y="288">1.2.2 maps asSpreadsheetText inside writer call</text></svg>
