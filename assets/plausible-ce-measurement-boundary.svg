<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
<title id="title">Where newsletter measurement stops</title><desc id="desc">Newsletter sender, site arrival, Plausible CE analytics and account database shown as separate systems with evidence boundaries.</desc>
<rect width="920" height="320" rx="20" fill="#f5faf7"/>
<text x="38" y="44" fill="#1a6b52" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="2">FOUR RECORDS, NOT ONE FUNNEL PROOF</text>
<path d="M200 146h32m178 0h32m178 0h32" stroke="#779c89" stroke-width="3" stroke-linecap="round"/><path d="m226 140 9 6-9 6m210-12 9 6-9 6m210-12 9 6-9 6" fill="none" stroke="#779c89" stroke-width="3" stroke-linejoin="round"/>
<g font-family="system-ui,sans-serif"><rect x="35" y="82" width="165" height="134" rx="14" fill="#fff" stroke="#c8ddd1" stroke-width="2"/><rect x="245" y="82" width="165" height="134" rx="14" fill="#fff" stroke="#c8ddd1" stroke-width="2"/><rect x="455" y="82" width="165" height="134" rx="14" fill="#e9f6ee" stroke="#6bb38d" stroke-width="2"/><rect x="665" y="82" width="220" height="134" rx="14" fill="#fff" stroke="#c8ddd1" stroke-width="2"/>
<text x="50" y="117" fill="#173b2e" font-size="18" font-weight="800">Sender</text><text x="50" y="144" fill="#416255" font-size="14">Delivery / clicks</text><text x="50" y="175" fill="#8b5b18" font-size="13" font-weight="700">Outside CE</text>
<text x="260" y="117" fill="#173b2e" font-size="18" font-weight="800">Site arrival</text><text x="260" y="144" fill="#416255" font-size="14">Generic UTM link</text><text x="260" y="175" fill="#8b5b18" font-size="13" font-weight="700">Load not assured</text>
<text x="470" y="117" fill="#173b2e" font-size="18" font-weight="800">Plausible CE</text><text x="470" y="144" fill="#416255" font-size="14">View + event + goal</text><text x="470" y="175" fill="#176b53" font-size="13" font-weight="700">Analytics record</text>
<text x="680" y="117" fill="#173b2e" font-size="18" font-weight="800">Account system</text><text x="680" y="144" fill="#416255" font-size="14">Authoritative signup</text><text x="680" y="175" fill="#8b5b18" font-size="13" font-weight="700">Outside CE</text>
<line x1="36" y1="242" x2="884" y2="242" stroke="#c8ddd1"/><text x="38" y="271" fill="#173b2e" font-size="15" font-weight="700">A goal rate counts filtered analytics identities. Last-click credit is a rule, not causal lift.</text>
</g></svg>
