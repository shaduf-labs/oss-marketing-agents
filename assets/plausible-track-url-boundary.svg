<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Whole-URL request boundary</title><desc id="desc">Generic UTM and fictional-token URLs both reach a mocked sendRequest once. A transform returning null makes no mock call. No network was run.</desc><rect width="900" height="350" rx="24" fill="#f4f9f5"/><text x="36" y="42" fill="#173b2c" font-family="system-ui,sans-serif" font-size="24" font-weight="700">One function, three synthetic inputs</text><g font-family="system-ui,sans-serif"><rect x="36" y="70" width="248" height="69" rx="12" fill="#fff" stroke="#9acbb4"/><text x="55" y="99" fill="#174c38" font-size="17" font-weight="700">Generic UTM URL</text><text x="55" y="122" fill="#426251" font-size="13">No recipient value</text><rect x="36" y="154" width="248" height="69" rx="12" fill="#fff" stroke="#d99e63"/><text x="55" y="183" fill="#8d4c12" font-size="17" font-weight="700">UTM + fictional token</text><text x="55" y="206" fill="#665749" font-size="13">Whole query still present</text><rect x="36" y="238" width="248" height="69" rx="12" fill="#fff" stroke="#95a9a0"/><text x="55" y="267" fill="#3a5b4c" font-size="17" font-weight="700">Transform → null</text><text x="55" y="290" fill="#52665b" font-size="13">Negative control</text><rect x="350" y="111" width="210" height="151" rx="16" fill="#176b53"/><text x="374" y="158" fill="#fff" font-size="20" font-weight="700">Tagged track()</text><text x="374" y="186" fill="#e3f3e9" font-size="14">exact v3.2.1 function</text><text x="374" y="210" fill="#e3f3e9" font-size="14">mocked imports</text><rect x="632" y="70" width="232" height="153" rx="15" fill="#fff" stroke="#9acbb4"/><text x="651" y="104" fill="#174c38" font-size="17" font-weight="700">In-memory mock</text><text x="651" y="135" fill="#426251" font-size="14">Generic: 1 whole-URL call</text><text x="651" y="162" fill="#8d4c12" font-size="14">Token: 1 whole-URL call</text><text x="651" y="189" fill="#3a5b4c" font-size="14">Null: 0 calls</text><path d="M284 105H330M284 189H330M284 273H330M330 105V273M330 189H350M560 186h72" fill="none" stroke="#477f65" stroke-width="3"/><path d="m625 177 10 9-10 9" fill="none" stroke="#477f65" stroke-width="3"/><text x="632" y="276" fill="#52665b" font-size="14">Not HTTP · not CE ingestion</text></g></svg>