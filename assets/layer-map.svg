<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Four layers for open-source marketing work</title><desc id="desc">A staircase from a small, bounded agent experiment to a self-hosted marketing platform. Each step shows the ownership and operating burden rising.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e7f7ef"/><stop offset="1" stop-color="#fff2ce"/></linearGradient></defs><rect width="1000" height="420" rx="28" fill="url(#g)"/><text x="55" y="60" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#315044">Choose the lowest layer that can safely do the job</text><path d="M80 350H930" stroke="#b8d6c5" stroke-width="3"/><g font-family="system-ui,sans-serif"><g><rect x="90" y="268" width="190" height="82" rx="15" fill="#fff" stroke="#77b998" stroke-width="2"/><text x="110" y="302" font-size="17" font-weight="700" fill="#155f49">Loopmark</text><text x="110" y="327" font-size="14" fill="#456056">bounded draft pilot</text></g><g><rect x="300" y="208" width="190" height="142" rx="15" fill="#fff" stroke="#77b998" stroke-width="2"/><text x="320" y="243" font-size="17" font-weight="700" fill="#155f49">Marketing Agent OS</text><text x="320" y="268" font-size="14" fill="#456056">skills in an existing</text><text x="320" y="287" font-size="14" fill="#456056">agent harness</text></g><g><rect x="510" y="140" width="190" height="210" rx="15" fill="#fff" stroke="#77b998" stroke-width="2"/><text x="530" y="176" font-size="17" font-weight="700" fill="#155f49">Activepieces CE</text><text x="530" y="201" font-size="14" fill="#456056">connect existing systems</text><text x="530" y="220" font-size="14" fill="#456056">with review, logs,</text><text x="530" y="239" font-size="14" fill="#456056">backups and ownership</text></g><g><rect x="720" y="82" width="190" height="268" rx="15" fill="#fff" stroke="#77b998" stroke-width="2"/><text x="740" y="119" font-size="17" font-weight="700" fill="#155f49">Mautic</text><text x="740" y="144" font-size="14" fill="#456056">own contacts, forms,</text><text x="740" y="163" font-size="14" fill="#456056">campaigns and delivery</text><text x="740" y="182" font-size="14" fill="#456056">operations</text></g><text x="88" y="385" font-size="14" fill="#456056">Less operating burden</text><text x="740" y="385" font-size="14" fill="#456056">More ownership &amp; operations</text></g></svg>
