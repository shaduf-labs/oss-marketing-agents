<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Postiz CLI alt-text source path and unverified delivery</title><desc id="desc">Tagged CLI source maps the alt option by content index into image alt, then passes a JSON post to the API client. Missing or misaligned values can omit or shift descriptions. Later Postiz and Instagram stages were not observed.</desc><style>text{font-family:system-ui,Arial,sans-serif;fill:#17372a}.small{font-size:18px}.head{font-size:24px;font-weight:700}.minor{font-size:16px;fill:#405f51}.box{fill:#f4faf6;stroke:#65a88b;stroke-width:2}.warn{fill:#fff6e9;stroke:#bb7c2d;stroke-width:2}.open{fill:#f5f6f8;stroke:#8895a3;stroke-width:2;stroke-dasharray:6 5}.arrow{stroke:#23765b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#23765b"/></marker></defs><rect width="1000" height="340" rx="20" fill="#fff"/><text class="small" x="28" y="40">Inspected in exact tagged source</text><rect class="box" x="28" y="65" width="200" height="94" rx="12"/><text class="head" x="46" y="104">--alt</text><text class="minor" x="46" y="134">repeatable input</text><path class="arrow" d="M233 112H270"/><rect class="box" x="275" y="65" width="216" height="94" rx="12"/><text class="head" x="293" y="104">Index + split</text><text class="minor" x="293" y="134">by content position</text><path class="arrow" d="M496 112H531"/><rect class="box" x="536" y="65" width="190" height="94" rx="12"/><text class="head" x="554" y="104">image[].alt</text><text class="minor" x="554" y="134">if nonempty</text><path class="arrow" d="M731 112H766"/><rect class="box" x="771" y="65" width="199" height="94" rx="12"/><text class="head" x="789" y="104">JSON POST</text><text class="minor" x="789" y="134">client method</text><rect class="warn" x="28" y="191" width="462" height="116" rx="12"/><text class="head" x="48" y="229">Silent mapping risk</text><text class="small" x="48" y="261">Empty / missing → property omitted</text><text class="small" x="48" y="287">Misaligned repeat → wrong segment</text><rect class="open" x="518" y="191" width="452" height="116" rx="12"/><text class="head" x="538" y="229">Not observed</text><text class="small" x="538" y="261">Shipped binary or request bytes</text><text class="small" x="538" y="287">Postiz app or Instagram display</text></svg>
