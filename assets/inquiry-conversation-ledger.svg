<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc"><title id="title">Inquiry-to-qualified evidence chain</title><desc id="desc">Five evidence records form a left-to-right chain. Uncertain joins move into a held exception.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#397c63" stroke-width="1.3"/></marker></defs><rect width="900" height="250" rx="16" fill="#f4faf6"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#9dcbb4" stroke-width="2"><rect x="18" y="35" width="145" height="93" rx="10"/><rect x="197" y="35" width="145" height="93" rx="10"/><rect x="376" y="35" width="145" height="93" rx="10"/><rect x="555" y="35" width="145" height="93" rx="10"/><rect x="734" y="35" width="145" height="93" rx="10"/></g><g font-size="16" font-weight="700" fill="#17372a"><text x="90" y="69">Accepted</text><text x="90" y="91">inquiry</text><text x="269" y="69">CRM</text><text x="269" y="91">receipt</text><text x="448" y="69">Linked</text><text x="448" y="91">booking</text><text x="627" y="69">Reviewed</text><text x="627" y="91">attendance</text><text x="806" y="69">Human</text><text x="806" y="91">qualified</text></g><g font-size="12" fill="#526c5d"><text x="90" y="113">form owner</text><text x="269" y="113">CRM owner</text><text x="448" y="113">calendar owner</text><text x="627" y="113">meeting host</text><text x="806" y="113">reviewer + rubric</text></g><g stroke="#397c63" stroke-width="2" marker-end="url(#arrow)"><path d="M165 81h25"/><path d="M344 81h25"/><path d="M523 81h25"/><path d="M702 81h25"/></g><path d="M448 130v30" stroke="#9a691c" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="169" width="236" height="54" rx="10" fill="#fff6e6" stroke="#d5a858" stroke-width="2"/><text x="448" y="191" font-size="15" font-weight="700" fill="#745119">Uncertain join → hold</text><text x="448" y="210" font-size="12" fill="#745119">retain in inquiry denominator</text></g></svg>
