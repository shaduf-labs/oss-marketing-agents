<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Pre-send evidence levels</title><desc id="desc">Preview, generated message, local receipt, provider acceptance and recipient observation are separate evidence levels.</desc><rect width="960" height="270" rx="20" fill="#f3f9f5"/><path d="M36 117H925" stroke="#87b89e" stroke-width="4"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#176b53"><circle cx="107" cy="117" r="33"/><circle cx="292" cy="117" r="33"/><circle cx="477" cy="117" r="33"/></g><g fill="#67786f"><circle cx="662" cy="117" r="33"/><circle cx="847" cy="117" r="33"/></g><g fill="#fff" font-size="24" font-weight="700"><text x="107" y="125">1</text><text x="292" y="125">2</text><text x="477" y="125">3</text><text x="662" y="125">4</text><text x="847" y="125">5</text></g><g fill="#183c2d" font-size="18" font-weight="700"><text x="107" y="59">Preview</text><text x="292" y="59">Generated</text><text x="477" y="59">Local SMTP</text><text x="662" y="59">Provider</text><text x="847" y="59">Recipient</text></g><g fill="#415d4e" font-size="14"><text x="107" y="181">Editor view</text><text x="292" y="181">Actual variables</text><text x="477" y="181">Envelope + MIME</text><text x="662" y="181">Acceptance ID</text><text x="847" y="181">One mailbox</text></g><g font-size="13" font-weight="700"><text x="292" y="218" fill="#176b53">Not observed in this report</text><text x="662" y="218" fill="#67786f">Also not observed</text></g></g></svg>
