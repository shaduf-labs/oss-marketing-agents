<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" role="img" aria-labelledby="title desc">
<title id="title">Who owns each step from brief to possible external action</title><desc id="desc">A left-to-right handoff: organization-owned brief and draft, separate human approval record, optional executor, and sender or CRM. The sender holds production credentials and checks consent. A dashed line marks the unverified integration.</desc>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#17372a}.label{font-size:21px;font-weight:700}.small{font-size:15px}.tiny{font-size:13px}.line{stroke:#247963;stroke-width:3;fill:none}.dash{stroke:#b56d18;stroke-width:3;stroke-dasharray:8 6;fill:none}</style>
<rect width="960" height="444" rx="22" fill="#f5faf7"/>
<text x="34" y="42" class="small">PROPOSED HANDOFF · NOT AN IMPLEMENTED INTEGRATION</text>
<rect x="28" y="74" width="200" height="190" rx="14" fill="#e1f2e8" stroke="#8fc7ad"/><text x="45" y="110" class="label">1 · Draft</text><text x="45" y="141" class="small">Versioned brief + output</text><text x="45" y="169" class="small">Organization owns files,</text><text x="45" y="192" class="small">permissions, backup</text><text x="45" y="239" class="tiny">Skill host is not a sender</text>
<path d="M232 168h28" class="line"/><path d="m255 161 10 7-10 7" class="line"/>
<rect x="270" y="74" width="200" height="190" rx="14" fill="#fff2d8" stroke="#e6b761"/><text x="287" y="110" class="label">2 · Decision</text><text x="287" y="141" class="small">Named human records</text><text x="287" y="164" class="small">draft hash, scope, time,</text><text x="287" y="187" class="small">expiry in separate record</text><text x="287" y="239" class="tiny">No CE approval implied</text>
<path d="M474 168h28" class="dash"/><path d="m497 161 10 7-10 7" class="dash"/>
<rect x="512" y="74" width="200" height="190" rx="14" fill="#e9f0f8" stroke="#aac4dc"/><text x="529" y="110" class="label">3 · Optional flow</text><text x="529" y="141" class="small">CE run evidence, retries</text><text x="529" y="164" class="small">Operator owns worker,</text><text x="529" y="187" class="small">key, logs and recovery</text><text x="529" y="239" class="tiny">No exactly-once guarantee</text>
<path d="M716 168h28" class="dash"/><path d="m739 161 10 7-10 7" class="dash"/>
<rect x="754" y="74" width="178" height="190" rx="14" fill="#e5efe8" stroke="#9bbdab"/><text x="770" y="110" class="label">4 · Action</text><text x="770" y="141" class="small">Sender / CRM owner</text><text x="770" y="164" class="small">holds credential, checks</text><text x="770" y="187" class="small">consent + target state</text><text x="770" y="239" class="tiny">Future only, not tested</text>
<rect x="28" y="295" width="904" height="116" rx="13" fill="#fff" stroke="#d2e5da"/><text x="45" y="327" class="label">Stop at draft unless the action owner can verify:</text><text x="45" y="356" class="small">exact approved payload · current consent and suppression · target-side action ID and outcome</text><text x="45" y="382" class="small">monitoring/on-call · retention and tested restore · reconciliation before any retry</text>
</svg>
