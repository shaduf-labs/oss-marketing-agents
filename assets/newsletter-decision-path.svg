<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d"><title id="t">Small-list newsletter decision path</title><desc id="d">An existing operated sender is the first conditional option. If it cannot document consent, opt-outs, review and outcomes, stop. If a new self-hosted system is justified, Keila enters private evaluation, Listmonk needs a separate welcome trigger, and Mautic belongs to a broader campaign need. No route is approved to send by this audit.</desc><style>text{font-family:system-ui,sans-serif;fill:#17372a}.title{font-size:19px;font-weight:750}.small{font-size:13px}.label{font-size:12px;font-weight:750;letter-spacing:.05em}.line{fill:none;stroke:#6a9d83;stroke-width:3}.box{fill:#f1faf4;stroke:#b4d9c4;stroke-width:2}.warn{fill:#fff7e4;stroke:#eac985;stroke-width:2}.stop{fill:#fff0e9;stroke:#e6ad93;stroke-width:2}</style><rect x="8" y="8" width="884" height="304" rx="20" fill="#fff"/><text x="28" y="38" class="label">ONE WELCOME + OCCASIONAL NEWSLETTER</text><rect x="28" y="60" width="265" height="95" rx="14" class="box"/><text x="45" y="89" class="title">Existing operated sender?</text><text x="45" y="114" class="small">Consent · opt-out · review · outcomes</text><text x="45" y="135" class="small">must already have records and owners.</text><path d="M293 107H335M335 107V217H379" class="line"/><text x="309" y="92" class="small">No / unknown</text><rect x="379" y="177" width="198" height="81" rx="14" class="stop"/><text x="398" y="207" class="title">Stop and resolve</text><text x="398" y="231" class="small">missing operating evidence.</text><path d="M293 141H330V148H379" class="line"/><text x="316" y="139" class="small">Yes</text><rect x="379" y="61" width="198" height="83" rx="14" class="box"/><text x="398" y="90" class="title">Use it manually</text><text x="398" y="114" class="small">with named review.</text><text x="398" y="132" class="small">Still verify real-send gates.</text><rect x="623" y="61" width="245" height="83" rx="14" class="warn"/><text x="642" y="90" class="title">New tool justified?</text><text x="642" y="114" class="small">Keila: private evaluation only.</text><text x="642" y="132" class="small">No send-ready endorsement.</text><rect x="623" y="177" width="245" height="81" rx="14" class="warn"/><text x="642" y="205" class="title">Other scopes</text><text x="642" y="229" class="small">Listmonk: add welcome actor.</text><text x="642" y="247" class="small">Mautic: broader campaigns.</text></svg>
