<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d"><title id="t">Listmonk double-opt-in and welcome boundary</title><desc id="d">Submission creates an unconfirmed list membership and opt-in email. Confirmation changes membership to confirmed and renders a page. A separate reviewed operator trigger or manual step is needed for a distinct welcome.</desc><style>text{font-family:system-ui,sans-serif;fill:#17372a}.step{fill:#f3faf6;stroke:#8cbca3;stroke-width:2}.manual{fill:#fff7e5;stroke:#dba747;stroke-width:2}.head{font-size:17px;font-weight:700}.body{font-size:13px}.arrow{font-size:28px;fill:#23745d}@media(max-width:600px){.body{font-size:14px}}</style><rect class="step" x="12" y="26" width="260" height="190" rx="16"/><text class="head" x="34" y="66">1 · Submit</text><text class="body" x="34" y="104">Unconfirmed membership</text><text class="body" x="34" y="130">Opt-in email with link</text><text class="body" x="34" y="160">Not a later welcome</text><text class="arrow" x="284" y="128">→</text><rect class="step" x="320" y="26" width="260" height="190" rx="16"/><text class="head" x="342" y="66">2 · Confirm</text><text class="body" x="342" y="104">Membership confirmed</text><text class="body" x="342" y="130">Success page rendered</text><text class="body" x="342" y="160">No welcome call found</text><text class="arrow" x="591" y="128">→</text><rect class="manual" x="628" y="26" width="260" height="190" rx="16"/><text class="head" x="650" y="66">3 · If welcome needed</text><text class="body" x="650" y="104">Reviewed external trigger</text><text class="body" x="650" y="130">+ attempt ledger, or manual</text><text class="body" x="650" y="160">/api/tx is send only</text></svg>
