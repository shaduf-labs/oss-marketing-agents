<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="title desc"><title id="title">Two-newsletter no-send state map</title><desc id="desc">A source record feeds a global suppression gate, then distinct A and B state decisions. Pending, unknown and collision states remain held outside sendable lists. Row-level read-back and late-event replay complete the loop.</desc><style>text{font-family:system-ui,sans-serif;fill:#163d32}.h{font-size:19px;font-weight:700}.s{font-size:13px}.b{font-size:15px;font-weight:650}.line{stroke:#51957d;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{fill:#eff8f2;stroke:#73ad93;stroke-width:2}.hold{fill:#fff5e7;stroke:#dba757;stroke-width:2}.stop{fill:#fcefee;stroke:#cb7f78;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#51957d"/></marker></defs><rect width="920" height="370" rx="20" fill="#f8fcf9"/><rect class="box" x="25" y="65" width="180" height="100" rx="12"/><text class="h" x="45" y="96">Source ledger</text><text class="s" x="45" y="123">IDs · permission · A/B</text><text class="s" x="45" y="143">events · opt-out times</text><path class="line" d="M205 115H250"/><rect class="stop" x="250" y="65" width="180" height="100" rx="12"/><text class="h" x="270" y="96">Global gate</text><text class="s" x="270" y="123">Block / bounce / complaint</text><text class="s" x="270" y="143">overrides A and B</text><path class="line" d="M430 115H475"/><rect class="box" x="475" y="25" width="180" height="100" rx="12"/><text class="h" x="495" y="57">Newsletter A</text><text class="s" x="495" y="83">Own list and latest event</text><path class="line" d="M430 115C455 115 450 235 475 235"/><rect class="box" x="475" y="185" width="180" height="100" rx="12"/><text class="h" x="495" y="217">Newsletter B</text><text class="s" x="495" y="243">Own list and latest event</text><rect class="hold" x="695" y="25" width="200" height="120" rx="12"/><text class="h" x="715" y="58">Hold outside lists</text><text class="s" x="715" y="84">Pending · unknown</text><text class="s" x="715" y="105">permission · collision</text><path class="line" d="M655 75H690"/><rect class="box" x="695" y="185" width="200" height="100" rx="12"/><text class="h" x="715" y="217">Read back both rows</text><text class="s" x="715" y="243">Replay late events first</text><path class="line" d="M655 235H690"/><text class="b" x="28" y="340">No campaign until global, A and B records match the approved mapping row by row.</text></svg>
