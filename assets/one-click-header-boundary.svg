<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">One-click header scope</title><desc id="d">Campaign A routes to the newsletter A header, campaign B to newsletter B. A separate body preferences link is not part of the header check.</desc><rect width="900" height="280" rx="18" fill="#f5faf6"/><text x="34" y="36" fill="#17372a" font-family="system-ui,sans-serif" font-weight="700" font-size="20">Advertised header route before send</text><g font-family="system-ui,sans-serif" font-size="17"><rect x="34" y="61" width="203" height="67" rx="11" fill="#dff3e8" stroke="#83b59c"/><text x="55" y="91" fill="#17372a" font-weight="700">Campaign A</text><text x="55" y="113" fill="#405f51" font-size="14">newsletter-a</text><path d="M240 95H345" stroke="#176b53" stroke-width="4" marker-end="url(#a)"/><rect x="350" y="61" width="510" height="67" rx="11" fill="#fff" stroke="#83b59c"/><text x="371" y="90" fill="#17372a" font-weight="700">One-click header: /newsletter-a/</text><text x="371" y="113" fill="#405f51" font-size="14">Exact approved HTTPS URI; not /newsletter-b/ or /all/</text><rect x="34" y="148" width="203" height="67" rx="11" fill="#e7f0fc" stroke="#91b2d3"/><text x="55" y="178" fill="#17372a" font-weight="700">Campaign B</text><text x="55" y="200" fill="#405f51" font-size="14">newsletter-b</text><path d="M240 182H345" stroke="#39739e" stroke-width="4" marker-end="url(#b)"/><rect x="350" y="148" width="510" height="67" rx="11" fill="#fff" stroke="#91b2d3"/><text x="371" y="177" fill="#17372a" font-weight="700">One-click header: /newsletter-b/</text><text x="371" y="200" fill="#405f51" font-size="14">Exact approved HTTPS URI; not /newsletter-a/ or /all/</text><text x="35" y="251" fill="#6b571f" font-size="14">Body preferences link may offer all-lists choice; this parser does not test it or endpoint behavior.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#176b53"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#39739e"/></marker></defs></svg>
