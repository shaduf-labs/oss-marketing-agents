<rect x="678" y="27" width="195" height="106" rx="14" fill="#e4f3ea" stroke="#7cb89b" stroke-width="2"/><text x="698" y="60" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#225f46">CE link</text><text x="698" y="88" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#17372a">GitHub repository</text><text x="698" y="111" font-family="system-ui,sans-serif" font-size="13" fill="#476358">Quick start visible</text>
