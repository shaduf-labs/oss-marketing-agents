<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" role="img" aria-labelledby="t d">
<title id="t">Plausible Community Edition announcement handoff</title><desc id="d">The announcement points to a self-hosted comparison page. From there Community Edition points to a GitHub repository, while a separate labelled Cloud trial button points to registration.</desc>
