<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" role="img" aria-labelledby="t d"><title id="t">One campaign link decision</title><desc id="d">Approved URL branches to direct distribution or an optional private YOURLS redirect. The redirect adds approval and cache risk. Outcomes need a separate site record.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#497969"/></marker></defs><rect width="920" height="270" rx="20" fill="#f5faf7"/><g font-family="system-ui,sans-serif" fill="#17372a"><rect x="27" y="91" width="182" height="87" rx="13" fill="#e4f2e9" stroke="#7fb69d"/><text x="43" y="120" font-size="16" font-weight="700">Approved target</text><text x="43" y="144" font-size="13">Full HTTPS URL + UTMs</text><path d="M209 115 H285 V68 H326" fill="none" stroke="#497969" stroke-width="3" marker-end="url(#a)"/><path d="M209 153 H285 V207 H326" fill="none" stroke="#497969" stroke-width="3" marker-end="url(#a)"/><rect x="329" y="25" width="275" height="86" rx="13" fill="#d9f1e4" stroke="#5eaa83"/><text x="347" y="55" font-size="16" font-weight="700">Direct URL · default</text><text x="347" y="79" font-size="13">No additional redirect service</text><rect x="329" y="159" width="275" height="91" rx="13" fill="#fff4d8" stroke="#d5a147"/><text x="347" y="188" font-size="16" font-weight="700">Private YOURLS · conditional</text><text x="347" y="211" font-size="13">Steward + approval ledger</text><text x="347" y="229" font-size="13">301 cache limits rollback</text><path d="M604 69 H685" fill="none" stroke="#497969" stroke-width="3" marker-end="url(#a)"/><path d="M604 205 H655 V95 H685" fill="none" stroke="#497969" stroke-width="3" marker-end="url(#a)"/><rect x="688" y="53" width="203" height="88" rx="13" fill="#fff" stroke="#a8cbb9"/><text x="705" y="82" font-size="16" font-weight="700">Separate outcomes</text><text x="705" y="106" font-size="13">Arrival, signup or sale</text><text x="705" y="124" font-size="13">need their own evidence</text></g></svg>
