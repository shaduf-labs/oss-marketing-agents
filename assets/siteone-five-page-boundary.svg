<svg xmlns="http://www.w3.org/2000/svg" width="920" height="292" viewBox="0 0 920 292" role="img" aria-labelledby="title desc"><title id="title">Five-page promotion check boundary</title><desc id="desc">Manual review is the default. An authorized crawler requires an external exact-scope guard and ends in human verification.</desc><rect width="920" height="292" rx="20" fill="#f5faf7"/><g font-family="system-ui,sans-serif"><text x="34" y="42" fill="#176b53" font-size="14" font-weight="800" letter-spacing="2">FIVE-PAGE CHECK · SOURCE-ONLY DECISION</text><rect x="34" y="74" width="233" height="124" rx="14" fill="#e8f5ed" stroke="#76b796" stroke-width="2"/><text x="51" y="111" fill="#173b2e" font-size="18" font-weight="800">Manual review first</text><text x="51" y="139" fill="#416255" font-size="14">All five routes + one</text><text x="51" y="161" fill="#416255" font-size="14">authorized page audit</text><path d="M267 136h54" stroke="#779c89" stroke-width="3"/><path d="m312 130 9 6-9 6" fill="none" stroke="#779c89" stroke-width="3"/><rect x="321" y="74" width="268" height="124" rx="14" fill="#fff" stroke="#c8ddd1" stroke-width="2"/><text x="338" y="111" fill="#173b2e" font-size="18" font-weight="800">Crawl only if needed</text><text x="338" y="139" fill="#416255" font-size="14">Owner authorization + external</text><text x="338" y="161" fill="#416255" font-size="14">exact host/path guard</text><path d="M589 136h42" stroke="#779c89" stroke-width="3"/><path d="m622 130 9 6-9 6" fill="none" stroke="#779c89" stroke-width="3"/><rect x="631" y="74" width="255" height="124" rx="14" fill="#fff" stroke="#c8ddd1" stroke-width="2"/><text x="648" y="111" fill="#173b2e" font-size="18" font-weight="800">Verify every finding</text><text x="648" y="139" fill="#416255" font-size="14">Local report + response +</text><text x="648" y="161" fill="#416255" font-size="14">rendered page</text><line x1="35" y1="224" x2="885" y2="224" stroke="#c8ddd1"/><text x="36" y="254" fill="#805100" font-size="15" font-weight="700">No permission or no external guard? Stay with manual review. No crawler was run here.</text></g></svg>
