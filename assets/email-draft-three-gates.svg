<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 255" role="img" aria-labelledby="t d"><title id="t">Three separate email-edit checks</title><desc id="d">Sender preview, optional MJML draft compilation, and final sender message with client check. Evidence advances but no one gate proves delivery.</desc><rect width="900" height="255" rx="22" fill="#f4f9f5"/><g font-family="system-ui,sans-serif"><g transform="translate(24 25)"><rect width="258" height="182" rx="17" fill="#fff" stroke="#a8cdb9" stroke-width="2"/><rect width="258" height="12" rx="6" fill="#196b51"/><text x="20" y="51" font-size="16" font-weight="700" fill="#17372a">1 · Sender preview</text><text x="20" y="83" font-size="13" fill="#335547">Authoritative editor and approval</text><text x="20" y="106" font-size="13" fill="#335547">for the changed draft</text><path d="M20 128h218" stroke="#d7e5db"/><text x="20" y="152" font-size="12" fill="#6b5140">Not final MIME or client display</text></g><g transform="translate(321 25)"><rect width="258" height="182" rx="17" fill="#fff" stroke="#a8cdb9" stroke-width="2"/><rect width="258" height="12" rx="6" fill="#b47b30"/><text x="20" y="51" font-size="16" font-weight="700" fill="#17372a">2 · MJML, if owned</text><text x="20" y="83" font-size="13" fill="#335547">Strict validation + HTML</text><text x="20" y="106" font-size="13" fill="#335547">assertions · UNRUN here</text><path d="M20 128h218" stroke="#d7e5db"/><text x="20" y="152" font-size="12" fill="#6b5140">Not a send or link approval</text></g><g transform="translate(618 25)"><rect width="258" height="182" rx="17" fill="#fff" stroke="#a8cdb9" stroke-width="2"/><rect width="258" height="12" rx="6" fill="#466d90"/><text x="20" y="51" font-size="16" font-weight="700" fill="#17372a">3 · Final message</text><text x="20" y="83" font-size="13" fill="#335547">Sender output, then authorized</text><text x="20" y="106" font-size="13" fill="#335547">controlled-client check</text><path d="M20 128h218" stroke="#d7e5db"/><text x="20" y="152" font-size="12" fill="#6b5140">Not universal delivery evidence</text></g><path d="M289 116h24m-7-8 8 8-8 8M586 116h24m-7-8 8 8-8 8" fill="none" stroke="#477666" stroke-width="3" stroke-linecap="round"/></g></svg>
