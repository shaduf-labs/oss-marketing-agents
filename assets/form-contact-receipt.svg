<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="t d"><title id="t">Form-to-contact handoff</title><desc id="d">An accepted form event is recorded with its source and preference. A reviewed handoff records the Mautic contact ID if used. A separate destination receipt records the CRM ID or a held or failed exception.</desc><rect width="900" height="230" rx="22" fill="#edf7f1"/><g font-family="system-ui, sans-serif" fill="#17372a"><rect x="24" y="36" width="248" height="150" rx="16" fill="#fff" stroke="#9fcdb8" stroke-width="2"/><text x="44" y="69" font-size="17" font-weight="700">Accepted inquiry</text><text x="44" y="101" font-size="14">Form + submission ID</text><text x="44" y="124" font-size="14">Raw source, notice, choice</text><text x="44" y="147" font-size="14">Received / held / failed</text><path d="M283 111h39" stroke="#176b53" stroke-width="4"/><path d="m321 103 12 8-12 8" fill="#176b53"/><rect x="340" y="36" width="226" height="150" rx="16" fill="#fff" stroke="#9fcdb8" stroke-width="2"/><text x="360" y="69" font-size="17" font-weight="700">Identity decision</text><text x="360" y="101" font-size="14">Match rule + review</text><text x="360" y="124" font-size="14">Mautic contact ID, if used</text><text x="360" y="147" font-size="14">No automatic promotion</text><path d="M577 111h39" stroke="#176b53" stroke-width="4"/><path d="m615 103 12 8-12 8" fill="#176b53"/><rect x="634" y="36" width="242" height="150" rx="16" fill="#fff" stroke="#9fcdb8" stroke-width="2"/><text x="654" y="69" font-size="17" font-weight="700">CRM receipt or exception</text><text x="654" y="101" font-size="14">Destination record ID</text><text x="654" y="124" font-size="14">Read-back + attempt</text><text x="654" y="147" font-size="14">Owner + replay state</text><text x="30" y="212" font-size="13" fill="#476457">A thank-you page or HTTP success is not a destination receipt.</text></g></svg>
