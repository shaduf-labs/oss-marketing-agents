<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">One welcome handoff record</title><desc id="desc">Consent, confirmation, approval, current suppression and a unique attempt precede the provider outcome. Unknown outcomes pause retries; unsubscribe and restore require reconciliation.</desc><style>text{font-family:system-ui,sans-serif;fill:#17372a}.label{font-size:14px;font-weight:700}.small{font-size:12px}.box{fill:#f1faf4;stroke:#9bc9ae;stroke-width:2}.warn{fill:#fff7e6;stroke:#dcac59;stroke-width:2}.line{fill:none;stroke:#5c9777;stroke-width:2.5}</style><rect x="4" y="4" width="892" height="332" rx="18" fill="#fff"/><path class="line" d="M150 101h26m123 0h26m123 0h26m123 0h26m123 0h26M733 137v47M150 220h26m123 0h26m123 0h26m123 0h26m123 0h26"/><g class="box"><rect x="22" y="64" width="128" height="74" rx="10"/><rect x="176" y="64" width="123" height="74" rx="10"/><rect x="325" y="64" width="123" height="74" rx="10"/><rect x="474" y="64" width="123" height="74" rx="10"/><rect x="623" y="64" width="123" height="74" rx="10"/><rect x="752" y="184" width="125" height="74" rx="10"/><rect x="474" y="184" width="123" height="74" rx="10"/><rect x="325" y="184" width="123" height="74" rx="10"/><rect x="176" y="184" width="123" height="74" rx="10"/></g><rect class="warn" x="623" y="184" width="123" height="74" rx="10"/><text x="32" y="92" class="label">Submit</text><text x="32" y="113" class="small">consent version</text><text x="186" y="92" class="label">Confirm</text><text x="186" y="113" class="small">DOI proof</text><text x="335" y="92" class="label">Approve</text><text x="335" y="113" class="small">copy + reviewer</text><text x="484" y="92" class="label">Suppress</text><text x="484" y="113" class="small">reread now</text><text x="633" y="92" class="label">Attempt</text><text x="633" y="113" class="small">unique claim</text><text x="762" y="213" class="label">Outcome</text><text x="762" y="234" class="small">provider ID</text><text x="633" y="213" class="label">Unknown?</text><text x="633" y="234" class="small">hold + reconcile</text><text x="484" y="213" class="label">Retry</text><text x="484" y="234" class="small">duplicate hold</text><text x="335" y="213" class="label">Opt out</text><text x="335" y="234" class="small">stop later work</text><text x="186" y="213" class="label">Restore</text><text x="186" y="234" class="small">no replay</text><text x="22" y="31" class="label">One durable record across the boundary</text><text x="22" y="305" class="small">Source-visible product state does not prove approval, provider receipt or exactly-once delivery.</text></svg>
