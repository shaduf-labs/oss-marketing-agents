<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">Campaign copy QA decision path</title><desc id="desc">Fact card and checklist first, then optional script or promptfoo, then mandatory human review and publication sign-off.</desc><rect width="960" height="320" rx="22" fill="#f4faf6"/><g font-family="system-ui,sans-serif" fill="#17372a"><rect x="28" y="38" width="198" height="88" rx="14" fill="#d9eee2"/><text x="45" y="69" font-size="18" font-weight="700">1 · Fact card</text><text x="45" y="93" font-size="14">Approved claims + URL</text><rect x="272" y="38" width="198" height="88" rx="14" fill="#e9f4d8"/><text x="289" y="69" font-size="18" font-weight="700">2 · Checklist</text><text x="289" y="93" font-size="14">One or a few drafts</text><path d="M226 82h42" stroke="#326d58" stroke-width="4"/><path d="m262 75 10 7-10 7" fill="#326d58"/><path d="M471 82h43" stroke="#326d58" stroke-width="4"/><path d="m507 75 10 7-10 7" fill="#326d58"/><rect x="518" y="38" width="195" height="88" rx="14" fill="#e9f4d8"/><text x="535" y="69" font-size="18" font-weight="700">3 · Human review</text><text x="535" y="93" font-size="14">Claims + exact bytes</text><path d="M713 82h34" stroke="#326d58" stroke-width="4"/><path d="m739 75 10 7-10 7" fill="#326d58"/><rect x="751" y="38" width="181" height="88" rx="14" fill="#d9eee2"/><text x="768" y="69" font-size="18" font-weight="700">4 · Publish</text><text x="768" y="93" font-size="14">Only signed version</text><rect x="272" y="174" width="198" height="94" rx="14" fill="#fff" stroke="#9dbdab" stroke-width="2"/><text x="289" y="205" font-size="17" font-weight="700">Optional script</text><text x="289" y="230" font-size="14">Repeated stable rules</text><rect x="518" y="174" width="195" height="94" rx="14" fill="#fff" stroke="#9dbdab" stroke-width="2"/><text x="535" y="205" font-size="17" font-weight="700">Optional promptfoo</text><text x="535" y="230" font-size="14">Many drafts / prompts</text><path d="M371 174V126m245 48v-48" stroke="#789886" stroke-width="2" stroke-dasharray="6 5"/><text x="29" y="297" font-size="14" fill="#466b58">Automation is an optional filter, not the approval record.</text></g></svg>
