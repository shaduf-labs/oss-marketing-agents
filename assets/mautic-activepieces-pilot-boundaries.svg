<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">Mautic and Activepieces CE controlled pilot boundaries</title><desc id="desc">Two comparison lanes show fictional input, a local-only reviewable artifact, human review and cleanup. A red stop line excludes external effects.</desc>
<rect width="1080" height="520" rx="28" fill="#f7fcf9"/>
<text x="50" y="62" fill="#17372a" font-family="system-ui,sans-serif" font-size="25" font-weight="700">One local artifact. No external action.</text>
<line x1="50" y1="95" x2="1030" y2="95" stroke="#c8ded1" stroke-width="2"/>
<g font-family="system-ui,sans-serif"><text x="50" y="136" fill="#12664e" font-size="18" font-weight="700">MAUTIC · PLATFORM PILOT</text><text x="50" y="330" fill="#12664e" font-size="18" font-weight="700">ACTIVEPIECES CE · ORCHESTRATOR PILOT</text></g>
<g font-family="system-ui,sans-serif" font-size="16"><rect x="50" y="155" width="190" height="112" rx="14" fill="#e5f5ed" stroke="#96caae"/><text x="70" y="190" fill="#17372a" font-weight="700">Fictional form</text><text x="70" y="216" fill="#405f51">No action configured</text><text x="70" y="240" fill="#405f51">Local only</text><path d="M258 211h72" stroke="#176b53" stroke-width="5"/><path d="m320 201 18 10-18 10" fill="none" stroke="#176b53" stroke-width="5"/>
<rect x="350" y="155" width="245" height="112" rx="14" fill="#fff" stroke="#96caae"/><text x="370" y="190" fill="#17372a" font-weight="700">Fictional contact + form</text><text x="370" y="216" fill="#405f51">Mailhog test transport</text><text x="370" y="240" fill="#405f51">No cron or campaign</text><path d="M613 211h72" stroke="#176b53" stroke-width="5"/><path d="m675 201 18 10-18 10" fill="none" stroke="#176b53" stroke-width="5"/>
<rect x="705" y="155" width="275" height="112" rx="14" fill="#fff9e9" stroke="#e8bc68"/><text x="725" y="190" fill="#704600" font-weight="700">Human review → cleanup</text><text x="725" y="216" fill="#704600">Inspect local artifact</text><text x="725" y="240" fill="#704600">Delete form, contact, data</text>
<rect x="50" y="350" width="190" height="112" rx="14" fill="#e5f5ed" stroke="#96caae"/><text x="70" y="385" fill="#17372a" font-weight="700">Fictional brief</text><text x="70" y="411" fill="#405f51">Manual/test input</text><text x="70" y="435" fill="#405f51">No Connection</text><path d="M258 406h72" stroke="#176b53" stroke-width="5"/><path d="m320 396 18 10-18 10" fill="none" stroke="#176b53" stroke-width="5"/>
<rect x="350" y="350" width="245" height="112" rx="14" fill="#fff" stroke="#96caae"/><text x="370" y="385" fill="#17372a" font-weight="700">Local Markdown / JSON</text><text x="370" y="411" fill="#405f51">Transform/code step only</text><text x="370" y="435" fill="#405f51">One visible run log</text><path d="M613 406h72" stroke="#176b53" stroke-width="5"/><path d="m675 396 18 10-18 10" fill="none" stroke="#176b53" stroke-width="5"/>
<rect x="705" y="350" width="275" height="112" rx="14" fill="#fff9e9" stroke="#e8bc68"/><text x="725" y="385" fill="#704600" font-weight="700">Human review → full purge</text><text x="725" y="411" fill="#704600">Inspect run and artifact</text><text x="725" y="435" fill="#704600">Delete flow, volume, secrets</text></g>
<g transform="translate(824 104)"><rect x="0" y="0" width="206" height="35" rx="17" fill="#ffe6e3"/><text x="15" y="23" fill="#9b3028" font-family="system-ui,sans-serif" font-size="14" font-weight="700">STOP: no external effect</text></g>
</svg>
