<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">One asset, three tracked placements</title><desc id="desc">The asset register, licence and consent evidence feed an approved variant. Separate arrows lead to email, landing page and social post, each with an owner and removal check. A correction or expiry requires action on every placement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#237257"/></marker></defs><rect width="900" height="440" rx="20" fill="#f5faf7"/><g font-family="system-ui, sans-serif" fill="#163c2d"><rect x="32" y="46" width="220" height="130" rx="16" fill="#fff" stroke="#92b8a4" stroke-width="2"/><text x="52" y="80" font-size="20" font-weight="700">Rights record</text><text x="52" y="109" font-size="15">Licence + consent scope</text><text x="52" y="134" font-size="15">Approver + end date</text><text x="52" y="159" font-size="15">Original + full-file hash</text><path d="M252 111H304" stroke="#237257" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="46" width="240" height="130" rx="16" fill="#e0f2e8" stroke="#237257" stroke-width="2"/><text x="330" y="80" font-size="20" font-weight="700">Approved variant</text><text x="330" y="110" font-size="15">HERO-017-v1-web.jpg</text><text x="330" y="137" font-size="15">Version + full-file hash</text><text x="330" y="160" font-size="15">New selection only</text><path d="M550 111H608" stroke="#237257" stroke-width="3" marker-end="url(#arrow)"/><rect x="610" y="26" width="258" height="81" rx="14" fill="#fff" stroke="#92b8a4" stroke-width="2"/><text x="630" y="57" font-size="18" font-weight="700">Email copy</text><text x="630" y="83" font-size="14">Campaign + ESP asset ID</text><rect x="610" y="120" width="258" height="81" rx="14" fill="#fff" stroke="#92b8a4" stroke-width="2"/><text x="630" y="151" font-size="18" font-weight="700">Landing-page copy</text><text x="630" y="177" font-size="14">URL + CMS media ID</text><rect x="610" y="214" width="258" height="81" rx="14" fill="#fff" stroke="#92b8a4" stroke-width="2"/><text x="630" y="245" font-size="18" font-weight="700">Social copy</text><text x="630" y="271" font-size="14">Platform + post ID</text><path d="M575 111V255H606" fill="none" stroke="#237257" stroke-width="3" marker-end="url(#arrow)"/><path d="M575 160H606" stroke="#237257" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="332" width="836" height="76" rx="14" fill="#153e2e"/><text x="52" y="363" fill="#fff" font-size="19" font-weight="700">Correction or expiry → check all three placement rows</text><text x="52" y="388" fill="#d9f0e4" font-size="15">Named owner replaces/removes each copy and records verification or an exception.</text></g></svg>
