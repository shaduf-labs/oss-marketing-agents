<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" role="img" aria-labelledby="t d">
<title id="t">Image-description receipt ladder</title><desc id="d">Five steps from composer to final post. Only step two, the tagged handler object passed to a mock, was observed.</desc>
<rect width="760" height="475" rx="22" fill="#f7fcf9"/>
<text x="34" y="44" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#17372a">What this test can—and cannot—confirm</text>
<g font-family="system-ui,sans-serif" font-size="16">
<rect x="34" y="70" width="692" height="65" rx="12" fill="#fff" stroke="#c9ded2"/><circle cx="68" cy="102" r="19" fill="#dcece3"/><text x="62" y="108" font-size="15" font-weight="700" fill="#214e3e">1</text><text x="105" y="96" font-weight="700" fill="#17372a">Composer description</text><text x="105" y="118" font-size="14" fill="#456056">Not tested: what a reviewer entered or approved</text>
<rect x="34" y="147" width="692" height="65" rx="12" fill="#176b53"/><circle cx="68" cy="179" r="19" fill="#d9f6e8"/><text x="62" y="185" font-size="15" font-weight="700" fill="#174837">2</text><text x="105" y="173" font-weight="700" fill="#fff">Tagged handler object → mocked API method</text><text x="105" y="195" font-size="14" fill="#e1f7ed">Observed: correct alt, positional shift, comma, missing and empty cases</text>
<rect x="34" y="224" width="692" height="65" rx="12" fill="#fff" stroke="#c9ded2"/><circle cx="68" cy="256" r="19" fill="#dcece3"/><text x="62" y="262" font-size="15" font-weight="700" fill="#214e3e">3</text><text x="105" y="250" font-weight="700" fill="#17372a">Released CLI, HTTP request and Postiz acceptance</text><text x="105" y="272" font-size="14" fill="#456056">Not tested</text>
<rect x="34" y="301" width="692" height="65" rx="12" fill="#fff" stroke="#c9ded2"/><circle cx="68" cy="333" r="19" fill="#dcece3"/><text x="62" y="339" font-size="15" font-weight="700" fill="#214e3e">4</text><text x="105" y="327" font-weight="700" fill="#17372a">Channel-specific provider acceptance</text><text x="105" y="349" font-size="14" fill="#456056">Not tested</text>
<rect x="34" y="378" width="692" height="65" rx="12" fill="#fff" stroke="#c9ded2"/><circle cx="68" cy="410" r="19" fill="#dcece3"/><text x="62" y="416" font-size="15" font-weight="700" fill="#214e3e">5</text><text x="105" y="404" font-weight="700" fill="#17372a">Final description and assistive-technology usefulness</text><text x="105" y="426" font-size="14" fill="#456056">Not tested; no reader reach result</text>
</g></svg>
